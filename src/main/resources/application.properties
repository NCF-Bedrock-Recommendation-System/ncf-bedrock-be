spring.config.import=optional:file:.env[.properties]

#APP
server.port=8080
spring.application.name=nckh_be

#DATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nckh_be}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

#JPA / HIBERNATE
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

#REDIS
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
#JWT
jwt.secret=${JWT_SECRET}
#Expiration time (milliseconds)
#1 hour
jwt.access.expiration_time=${JWT_ACCESS_EXPIRATION_TIME}
#3 days
jwt.refresh.expiration_time=${JWT_REFRESH_EXPIRATION_TIME}

#Swagger
springdoc.api-docs.enabled=true
springdoc.packagesToScan=com.example.base.controller
springdoc.pathsToMatch=/**

#Info Admin
app.admin.email=admin@base.com
app.admin.password=${ADMIN_PASSWORD}
app.admin.phone=0900000000
app.admin.fullName=System Administrator

#Security Endpoint
security.public-endpoints=/api/v1/auth/**,/swagger-ui/**,/v3/api-docs/**,/swagger-ui.html
security.user-endpoints=/api/v1/user/**,/swagger-ui/**,/v3/api-docs/**,/swagger-ui.html
security.admin-endpoints=/api/v1/admin/**,/swagger-ui/**,/v3/api-docs/**,/swagger-ui.html
security.swagger-endpoints=/swagger-ui/**,/v3/api-docs/**,/swagger-ui.html

# Debug logging
#logging.level.org.springframework.security.oauth2=DEBUG
#logging.level.org.springframework.web.client=DEBUG
#logging.level.org.springframework.security.web=DEBUG

# MAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@example.com}

# OAUTH
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
oauth.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
oauth.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
oauth.microsoft.tenant-id=${MICROSOFT_TENANT_ID:common}
oauth.microsoft.redirect-uri=${MICROSOFT_REDIRECT_URI:}
